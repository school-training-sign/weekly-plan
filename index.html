    <script>
      (() => {
        const requestedTab = new URLSearchParams(window.location.search).get("tab");
        const initialTab =
          requestedTab === "broadcast"
            ? "broadcast"
            : requestedTab === "events"
              ? "events"
              : "week";
        document.documentElement.dataset.initialTab = initialTab;
        const isPublicPages =
          window.location.origin === "https://school-training-sign.github.io" &&
          (window.location.pathname === "/weekly-plan" ||
            window.location.pathname.startsWith("/weekly-plan/"));
        if (!isPublicPages) {
          window.__WEEKLY_PLANNER_STATIC_SNAPSHOT_PROMISE__ = Promise.resolve(
            window.__WEEKLY_PLANNER_EMBEDDED_SNAPSHOT__ ?? null,
          );
          window.__WEEKLY_PLANNER_BROADCAST_SNAPSHOT_PROMISE__ =
            Promise.resolve(null);
          return;
        }
        /* Load same-origin snapshots without touching Apps Script at startup. */
        const loadSnapshot = (filename, cacheMode = "default") => {
          const controller = new AbortController();
          const timeout = window.setTimeout(() => controller.abort(), 4_000);
          const snapshotUrl = new URL(
            `/weekly-plan/${filename}`,
            window.location.origin,
          );
          return fetch(snapshotUrl, {
            method: "GET",
            credentials: "same-origin",
            // 시작 주간 자료는 배포 뒤에도 같은 파일명을 사용하므로 오래된
            // 브라우저 캐시를 재사용하지 않습니다. 방송 자료는 별도 revision
            // 동기화가 있어 일반 캐시를 유지합니다.
            cache: cacheMode,
            signal: controller.signal,
          })
            .then((response) => {
              if (!response.ok) return null;
              return response.json();
            })
            .catch(() => null)
            .finally(() => window.clearTimeout(timeout));
        };
        window.__WEEKLY_PLANNER_STATIC_SNAPSHOT_PROMISE__ = loadSnapshot(
          "startup-snapshot.json",
          "no-store",
        );
        const embeddedBroadcastSnapshot =
          window.__WEEKLY_PLANNER_EMBEDDED_BROADCAST_SNAPSHOT__ ?? null;
        if (embeddedBroadcastSnapshot) {
          window.__WEEKLY_PLANNER_BROADCAST_SNAPSHOT_PROMISE__ = Promise.resolve(
            embeddedBroadcastSnapshot,
          );
        } else if (initialTab === "broadcast") {
          window.__WEEKLY_PLANNER_BROADCAST_SNAPSHOT_PROMISE__ = loadSnapshot(
            "broadcast-snapshot.json",
          );
        }
      })();
